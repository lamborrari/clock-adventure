<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="看指针、选时间，和孩子一起练习读时钟。"><title>时钟小探险</title>
<style>
:root{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;color:#173b33;background:#f3f8ed;--green:#175b49;--blue:#2559a4;--orange:#ad481f}
*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #2559a4;outline-offset:4px}
.shell{max-width:1060px;margin:auto;padding:26px 24px 36px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:850}.brand{display:flex;align-items:center;gap:10px;font-size:20px}.icon{background:#dcebd5;border-radius:12px;padding:8px}.score{background:#fff8db;border:1px solid #ecdc9f;border-radius:99px;padding:9px 15px}
main{margin-top:24px;display:grid;grid-template-columns:1.1fr 1fr;border:1px solid #d9e5d5;border-radius:32px;overflow:hidden;background:white;box-shadow:0 14px 42px #234a2310}
.stage{display:grid;justify-items:center;align-content:center;gap:22px;padding:30px 24px;background-color:#e0efd9;background-image:radial-gradient(#9aba96 1px,transparent 1px);background-size:19px 19px}
.clock{width:min(100%,360px);aspect-ratio:1;border-radius:50%;border:12px solid #20735c;background:#fffdf5;position:relative;box-shadow:0 9px 0 #165443,0 17px 23px #173b3333}
.tick,.number,.hand,.pin{position:absolute}.tick{inset:0;transform:rotate(var(--angle))}.tick::before{content:"";position:absolute;top:3%;left:50%;width:2px;height:3%;background:#a7b8a7;transform:translateX(-50%)}.tick.major::before{width:3px;height:5%;background:#42806b}
.number{transform:translate(-50%,-50%);font-size:clamp(17px,4vw,28px);font-weight:850}
.hand{left:50%;bottom:50%;border-radius:99px;transform-origin:50% 100%}.hour{height:25%;width:11px;background:var(--blue)}.minute{height:35%;width:7px;background:var(--orange)}.pin{width:17px;height:17px;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:#175b49;border:3px solid #fffdf5}
.legend{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;background:#fffdf5;border-radius:99px;padding:9px 15px;font-size:14px;font-weight:800}.legend span:first-child{color:var(--blue)}.legend span:last-child{color:var(--orange)}
.quiz{padding:36px;display:flex;flex-direction:column;justify-content:center}.progress{align-self:flex-start;border-radius:99px;background:#d7eedf;color:#134e3a;padding:8px 12px;font-size:14px;font-weight:750}
h1{font-size:clamp(31px,5vw,49px);line-height:1.18;letter-spacing:-.04em;margin:22px 0 7px}p{margin:0;color:#4f665c;line-height:1.55}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:21px}
.answer{background:#f8faf6;border:2px solid #dce7dc;border-radius:16px;min-height:63px;font-size:29px;font-weight:850;font-variant-numeric:tabular-nums;color:#173b33}.answer:not(:disabled):hover{border-color:#478e75;background:#ecf6ed}.answer.wrong{background:#fff1e6;border-color:#d99468;color:#813a1c}.answer.correct{background:#dcf4dc;border-color:#5ba56b;color:#225b2f}.answer:disabled{cursor:default}
.feedback{min-height:52px;padding:9px 0;font-size:15px;font-weight:750}.next{min-height:49px;border:0;border-radius:14px;background:var(--green);color:white;font-weight:800}.next:disabled{background:#e6eee8;color:#50665a;cursor:default}.foot{text-align:center;margin-top:18px;font-size:14px}
@media(max-width:700px){.shell{padding:14px 12px 24px}main{grid-template-columns:1fr;margin-top:14px;border-radius:24px}.stage{padding:18px 15px 15px;gap:14px}.clock{width:min(64vw,265px);border-width:8px}.quiz{padding:18px}.legend{font-size:13px;padding:5px 12px}h1{margin-top:13px}.answers{margin-top:13px}.answer{min-height:49px;font-size:24px}.feedback{min-height:45px}.brand{font-size:17px}}
.popover{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:#173b3359;z-index:5}.popover[hidden]{display:none}.message{width:min(100%,310px);border-radius:25px;background:#fffdf5;border:3px solid #9ac5a5;padding:25px;text-align:center;box-shadow:0 12px 40px #173b3340}.message.wrong{border-color:#efa876}.popover:has(.message:not(.wrong)){cursor:pointer}.expression{font-size:58px;line-height:1.1}.message h2{margin:10px 0 6px;font-size:30px}.message button{margin-top:15px;padding:9px 22px;border:0;border-radius:12px;background:var(--green);color:#fff;font-weight:800}.message button[hidden]{display:none}
[hidden]{display:none!important}.modes{display:flex;gap:8px;margin-top:15px}.modes button{border:1px solid #c7ddcb;background:#fff;color:#255244;border-radius:99px;padding:9px 16px;font-weight:800}.modes button[aria-pressed=true]{background:#175b49;color:white;border-color:#175b49}.digital{font-size:42px;font-weight:850;font-variant-numeric:tabular-nums;margin-top:14px;color:#175b49}.readings{display:grid;gap:8px;margin:8px 0 0}.readings div{display:grid;grid-template-columns:4em 1fr;gap:8px;align-items:baseline;padding:10px 12px;border-radius:12px;background:#f1f7ee}.readings dt{font-size:14px;font-weight:800;color:#416254}.readings dd{margin:0;font-size:18px;font-weight:750;overflow-wrap:anywhere}.interactive{cursor:crosshair}.interactive .hand{cursor:grab;touch-action:none}.interactive .hand:active{cursor:grabbing}.interactive .hand::after{content:"";position:absolute;inset:-9px -8px 28%;border-radius:99px}.interactive .hand:focus-visible{outline:3px solid #173b33;outline-offset:3px}.interactive .pin{pointer-events:none}
.reveal{align-self:flex-start;margin-top:16px;min-height:44px;padding:9px 18px;border:0;border-radius:12px;background:#175b49;color:white;font-weight:800}.speech-options{display:flex;flex-wrap:wrap;align-items:center;gap:5px}.speech-button{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:5px 9px;border:1px solid #aacbb8;border-radius:9px;background:#fff;color:#173b33;text-align:left;font-weight:750}.speech-button:hover{background:#dceee1}.speech-divider{color:#577268}.speech-status:not(:empty){margin-top:8px;font-size:14px}#interface-language{font:inherit;color:#173b33;background:#fff;border:1px solid #aacbb8;border-radius:9px;padding:8px;max-width:100%}.top{flex-wrap:wrap}.top .score{margin-inline-start:auto}</style></head>
<body><div class="shell">
<header class="top"><div class="brand"><span class="icon" aria-hidden="true">◷</span><span id="brand-title">时钟小探险</span></div><span class="score" id="score" aria-live="polite">⭐ 0 颗星</span><select id="interface-language" aria-label="界面语言 / Interface language / Bahasa antarmuka"><option value="zh" lang="zh-CN">中文</option><option value="en" lang="en">English</option><option value="id" lang="id">Bahasa Indonesia</option></select></header>
<nav class="modes" aria-label="游戏模式"><button type="button" id="quiz-mode" aria-pressed="true">模式一 · 看钟答题</button><button type="button" id="explore-mode" aria-pressed="false">模式二 · 拨钟读时间</button></nav>
<main><section class="stage"><div id="clock" class="clock" role="img" aria-label="指针时钟"></div><div class="legend"><span>蓝色短针 · 时针</span><span>橙色长针 · 分针</span></div></section>
<section class="quiz" id="quiz"><p class="progress" id="progress" aria-live="polite"></p>
<h1>现在几点？</h1><p>看看两根指针，选出正确的时间。</p><div class="answers" id="answers"></div><p class="feedback" id="feedback" role="status"></p></section>
<section class="quiz" id="readings" hidden>
<h1>拨钟读时间</h1><p>拖动指针，或点表盘移动分针。先猜时间，再查看答案。</p>
<button class="reveal" type="button" id="reveal" aria-controls="reading-answer" aria-expanded="false">显示答案</button><div id="reading-answer" hidden><div class="digital" id="digital"></div>
<dl class="readings">
<div><dt id="english-label">英语</dt><dd lang="en" id="english"></dd></div>
<div><dt id="chinese-label">中文</dt><dd lang="zh-CN" id="chinese"></dd></div>
<div><dt id="indonesian-label">印尼语</dt><dd lang="id" id="indonesian"></dd></div>
</dl><p id="speech-status" class="speech-status" role="status"></p></div></section>
</main>
<p class="foot">答对一题，就能收集一颗星！</p></div>
<div class="popover" id="popover" hidden><div class="message" id="message" role="dialog" aria-modal="true" aria-labelledby="result-title" aria-describedby="result-detail" tabindex="-1"><div class="expression" id="expression" aria-hidden="true"></div><h2 id="result-title"></h2><p id="result-detail"></p><button type="button" id="retry">再试一次</button></div></div>
<script>
const clock = document.querySelector('#clock');
const answers = document.querySelector('#answers');
const feedback = document.querySelector('#feedback');
const shell = document.querySelector('.shell');
const popover = document.querySelector('#popover');
const message = document.querySelector('#message');
const expression = document.querySelector('#expression');
const resultTitle = document.querySelector('#result-title');
const resultDetail = document.querySelector('#result-detail');
const retry = document.querySelector('#retry');
let lastAnswer;
let advanceTimer;
function advanceQuestion() {
  if (advanceTimer === undefined) return;
  clearTimeout(advanceTimer);
  advanceTimer = undefined;
  closeResult();
  const previousLevel = level;
  level = Math.min(Math.floor(stars / questionsPerLevel), periods.length - 1);
  startQuestion(true, level !== previousLevel);
}
popover.addEventListener('click', advanceQuestion);
function closeResult() {
  popover.hidden = true;
  shell.inert = false;
}
function showResult(correct, detail, button) {
  lastAnswer = button;
  message.classList.toggle('wrong', !correct);
  expression.textContent = correct ? '🎉' : '😕';
  resultTitle.textContent = t(correct ? 'right' : 'wrong');
  resultDetail.textContent = detail;
  retry.hidden = correct;
  popover.hidden = false;
  shell.inert = true;
  if (correct) {
    message.focus();
    advanceTimer = setTimeout(advanceQuestion, 1000);
  } else {
    retry.focus();
  }
}
retry.addEventListener('click', () => {
  closeResult();
  lastAnswer.focus();
});
popover.addEventListener('keydown', event => {
  if (event.key === 'Tab') event.preventDefault();
  if (retry.hidden && ['Enter', ' '].includes(event.key)) {
    event.preventDefault();
    advanceQuestion();
  }
  if (event.key === 'Escape' && !retry.hidden) retry.click();
});
const score = document.querySelector('#score');
const progress = document.querySelector('#progress');
const periods = [60, 30, 5];
const levelKeys = ['whole', 'half', 'five'];
const questionsPerLevel = 5;
let level = 0;
let current = -1;
let stars = 0;

function addClockPart(className) {
  const part = document.createElement('span');
  part.className = className;
  part.setAttribute('aria-hidden', 'true');
  clock.append(part);
  return part;
}
for (let i = 0; i < 60; i++) {
  const tick = addClockPart(i % 5 === 0 ? 'tick major' : 'tick');
  tick.style.setProperty('--angle', (i * 6) + 'deg');
}
for (let i = 1; i <= 12; i++) {
  const number = addClockPart('number');
  const angle = i * Math.PI / 6;
  number.textContent = i;
  number.style.left = (50 + 37 * Math.sin(angle)) + '%';
  number.style.top = (50 - 37 * Math.cos(angle)) + '%';
}
const hourHand = addClockPart('hand hour');
const minuteHand = addClockPart('hand minute');
addClockPart('pin');

function formatTime(time) {
  const hour = Math.floor(time / 60) || 12;
  return hour + ':' + String(time % 60).padStart(2, '0');
}
function randomItem(items) {
  return items[Math.floor(Math.random() * items.length)];
}
function updateProgress() {
  const isFinalLevel = level === periods.length - 1;
  progress.textContent = t('level', level + 1, t(levelKeys[level])) +
    (isFinalLevel ? '' : t('progress', stars % questionsPerLevel, questionsPerLevel));
}
function startQuestion(focusAnswers = false, justAdvanced = false) {
  updateProgress();
  const step = periods[level];
  const times = Array.from({length:720 / step}, (_, i) => i * step);
  current = randomItem(times.filter(time => time !== current &&
    (!justAdvanced || time % periods[level - 1] !== 0)));
  const minute = current % 60;
  drawQuizClock();

  const nearby = times.filter(time => time !== current &&
    (time % 60 === minute || Math.floor(time / 60) === Math.floor(current / 60)));
  const choices = [current];
  while (choices.length < 4) {
    const pool = nearby.filter(time => !choices.includes(time));
    choices.push(randomItem(pool));
  }
  for (let i = choices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [choices[i], choices[j]] = [choices[j], choices[i]];
  }

  answers.replaceChildren();
  feedback.textContent = '';

  for (const time of choices) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'answer';
    button.textContent = formatTime(time);
    button.addEventListener('click', () => {
      if (time !== current) {
        button.classList.add('wrong');
        feedback.textContent = time % 60 === current % 60
          ? t('hourHint')
          : t('minuteHint');
        showResult(false, feedback.textContent, button);
        return;
      }
      button.classList.add('correct');
      stars++;
      score.textContent = t('score', stars);
      feedback.textContent = t('right') + ' ' + t('time', formatTime(current));
      for (const option of answers.children) option.disabled = true;
      const advances = level < periods.length - 1 && stars % questionsPerLevel === 0;
      const detail = advances ? t('unlock', t(levelKeys[level + 1])) : t('star');
      showResult(true, t('time', formatTime(current)) + ' ' + detail, button);
    });
    answers.append(button);
  }
  if (focusAnswers) answers.firstElementChild.focus();
}

const quiz = document.querySelector('#quiz');
const readings = document.querySelector('#readings');
const quizMode = document.querySelector('#quiz-mode');
const exploreMode = document.querySelector('#explore-mode');
const foot = document.querySelector('.foot');
const reveal = document.querySelector('#reveal');
const speechStatus = document.querySelector('#speech-status');
let activeAudio;
function stopSpeech() {
  const previousAudio = activeAudio;
  activeAudio = undefined;
  if (previousAudio) {
    previousAudio.pause();
    previousAudio.removeAttribute('src');
    previousAudio.load();
  }
  speechStatus.textContent = '';
}
function speakReading(phrase, language) {
  stopSpeech();
  const onlineLanguage = {'en-US': 'en', 'zh-CN': 'zh-CN', 'id-ID': 'id'}[language];
  const url = new URL('https://translate.google.com/translate_tts');
  url.search = new URLSearchParams({ie: 'UTF-8', client: 'tw-ob', tl: onlineLanguage, q: phrase});
  const audio = new Audio(url.href);
  activeAudio = audio;
  speechStatus.textContent = t('loading');
  audio.addEventListener('playing', () => {
    if (activeAudio === audio) speechStatus.textContent = '';
  });
  audio.addEventListener('ended', () => {
    if (activeAudio === audio) activeAudio = undefined;
  });
  const onFailure = () => {
    if (activeAudio !== audio) return;
    activeAudio = undefined;
    speechStatus.textContent = t('audioError');
  };
  audio.addEventListener('error', onFailure);
  audio.play().catch(onFailure);
}
function renderReadingButtons(container, phrases, language) {
  container.replaceChildren();
  container.className = 'speech-options';
  for (const [index, phrase] of phrases.entries()) {
    if (index) {
      const slash = document.createElement('span');
      slash.className = 'speech-divider';
      slash.textContent = '/';
      slash.setAttribute('aria-hidden', 'true');
      container.append(slash);
    }
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'speech-button';
    const icon = document.createElement('span');
    icon.textContent = '🔊';
    icon.setAttribute('aria-hidden', 'true');
    button.append(icon, phrase);
    button.addEventListener('click', () => speakReading(phrase, language));
    container.append(button);
  }
}
const readingAnswer = document.querySelector('#reading-answer');
const digital = document.querySelector('#digital');
function showReadingAnswer(show) {
  if (!show) stopSpeech();
  readingAnswer.hidden = !show;
  reveal.setAttribute('aria-expanded', String(show));
  reveal.textContent = t(show ? 'hide' : 'show');
}
reveal.addEventListener('click', () => showReadingAnswer(readingAnswer.hidden));
const english = document.querySelector('#english');
const chinese = document.querySelector('#chinese');
const indonesian = document.querySelector('#indonesian');
let exploring = false;
let exploreTime = 180;
let drag;
let draggedSincePress = false;
let minuteAnimation;

const enSmall = ['zero','one','two','three','four','five','six','seven','eight','nine',
  'ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const enTens = ['', '', 'twenty','thirty','forty','fifty'];
const zhDigits = '零一二三四五六七八九';
const idDigits = ['nol','satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan'];
function enNumber(n) {
  return n < 20 ? enSmall[n] : enTens[Math.floor(n / 10)] + (n % 10 ? '-' + enSmall[n % 10] : '');
}
function englishClockPhrase(hour, minute) {
  const currentHour = enNumber(hour);
  if (!minute) return currentHour + ' o’clock';
  const nextHour = enNumber(hour % 12 + 1);
  if (minute === 15) return 'a quarter past ' + currentHour;
  if (minute === 30) return 'half past ' + currentHour;
  if (minute === 45) return 'a quarter to ' + nextHour;
  const minutes = minute < 30 ? minute : 60 - minute;
  const amount = enNumber(minutes) + (minutes % 5 === 0 ? '' : minutes === 1 ? ' minute' : ' minutes');
  return minute < 30 ? amount + ' past ' + currentHour : amount + ' to ' + nextHour;
}
function zhNumber(n) {
  if (n < 10) return zhDigits[n];
  return (n < 20 ? '' : zhDigits[Math.floor(n / 10)]) + '十' + (n % 10 ? zhDigits[n % 10] : '');
}
function idNumber(n) {
  if (n < 10) return idDigits[n];
  if (n === 10) return 'sepuluh';
  if (n === 11) return 'sebelas';
  if (n < 20) return idDigits[n % 10] + ' belas';
  return idDigits[Math.floor(n / 10)] + ' puluh' + (n % 10 ? ' ' + idDigits[n % 10] : '');
}
function drawClock(time) {
  minuteAnimation?.cancel();
  hourHand.style.transform = 'translateX(-50%) rotate(' + (time / 2) + 'deg)';
  minuteHand.style.transform = 'translateX(-50%) rotate(' + (time % 60 * 6) + 'deg)';
}
function updateReadings() {
  const h = Math.floor(exploreTime / 60) || 12;
  const m = exploreTime % 60;
  digital.textContent = formatTime(exploreTime);
  const englishReadings = [englishClockPhrase(h, m)];
  const spokenHour = enNumber(h);
  const spokenMinutes = m ? (m < 10 ? ' oh ' : ' ') + enNumber(m) : '';
  englishReadings.push(spokenHour + spokenMinutes);
  renderReadingButtons(english, englishReadings, 'en-US');
  const zhHour = (h === 2 ? '两' : zhNumber(h)) + '点';
  const zhMinutes = (m < 10 ? '零' : '') + zhNumber(m) + '分';
  const zhAlternatives = {
    0: [zhHour + '整', zhHour],
    15: [zhHour + '一刻', zhHour + zhMinutes],
    30: [zhHour + '半', zhHour + zhMinutes],
    45: [zhHour + '三刻', zhHour + zhMinutes],
  };
  renderReadingButtons(chinese, zhAlternatives[m] ?? [zhHour + zhMinutes], 'zh-CN');
  const idHour = 'pukul ' + idNumber(h);
  const idReadings = [idHour + (m ? ' lewat ' + idNumber(m) + ' menit' : '')];
  if (m === 15) idReadings.push(idHour + ' lewat seperempat');
  if (m === 30) idReadings.push('pukul setengah ' + idNumber(h % 12 + 1));
  renderReadingButtons(indonesian, idReadings, 'id-ID');
  hourHand.setAttribute('aria-valuenow', h);
  minuteHand.setAttribute('aria-valuenow', m);
  drawClock(exploreTime);
}
function setMode(explore) {
  if (explore !== exploring) showReadingAnswer(false);
  exploring = explore;
  quizMode.setAttribute('aria-pressed', String(!explore));
  exploreMode.setAttribute('aria-pressed', String(explore));
  quiz.hidden = score.hidden = foot.hidden = explore;
  readings.hidden = !explore;
  clock.classList.toggle('interactive', explore);
  clock.setAttribute('role', explore ? 'group' : 'img');
  for (const hand of [hourHand, minuteHand]) {
    hand.setAttribute('aria-hidden', String(!explore));
    hand.tabIndex = explore ? 0 : -1;
  }
  if (explore) {
    clock.setAttribute('aria-label', t('adjustable'));
    updateReadings();
  } else {
    drawQuizClock();
  }
}
quizMode.addEventListener('click', () => setMode(false));
exploreMode.addEventListener('click', () => setMode(true));
function shiftTime(amount) {
  const nextTime = (exploreTime + amount + 720) % 720;
  if (nextTime === exploreTime) return;
  exploreTime = nextTime;
  showReadingAnswer(false);
  updateReadings();
}
function pointerAngle(event) {
  const rect = clock.getBoundingClientRect();
  return Math.atan2(event.clientX - rect.left - rect.width / 2,
    rect.top + rect.height / 2 - event.clientY) * 180 / Math.PI;
}
clock.addEventListener('pointerdown', event => {
  if (event.isPrimary && event.button === 0) draggedSincePress = false;
}, true);
clock.addEventListener('click', event => {
  if (!exploring || draggedSincePress || !event.detail) return;
  const rect = clock.getBoundingClientRect();
  const x = event.clientX - rect.left - rect.width / 2;
  const y = event.clientY - rect.top - rect.height / 2;
  if (Math.hypot(x, y) < 6) return;
  const minute = (Math.round(pointerAngle(event) / 6) + 60) % 60;
  const previousMinute = exploreTime % 60;
  if (minute === previousMinute) return;
  shiftTime(minute - previousMinute);
  if (minuteHand.animate && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const distance = (minute - previousMinute + 90) % 60 - 30;
    minuteAnimation = minuteHand.animate([
      {transform: 'translateX(-50%) rotate(' + previousMinute * 6 + 'deg)'},
      {transform: 'translateX(-50%) rotate(' + (previousMinute + distance) * 6 + 'deg)'},
    ], {duration: 220, easing: 'ease-out'});
  }
});
for (const [hand, unit, degrees] of [
  [hourHand, 60, 30],
  [minuteHand, 1, 6],
]) {
  hand.tabIndex = -1;
  hand.setAttribute('role', 'slider');

  hand.setAttribute('aria-valuemin', unit === 60 ? 1 : 0);
  hand.setAttribute('aria-valuemax', unit === 60 ? 12 : 59);
  hand.addEventListener('keydown', event => {
    const direction = {ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1}[event.key];
    if (!exploring || !direction) return;
    event.preventDefault();
    shiftTime(direction * unit);
  });
  hand.addEventListener('pointerdown', event => {
    if (!exploring || event.button !== 0 || drag) return;
    event.preventDefault();
    hand.focus();
    hand.setPointerCapture(event.pointerId);
    drag = {id: event.pointerId, angle: pointerAngle(event), remainder: 0};
  });
  hand.addEventListener('pointermove', event => {
    if (drag?.id !== event.pointerId) return;
    const angle = pointerAngle(event);
    if (Number.isNaN(angle)) return;
    drag.remainder += (angle - drag.angle + 540) % 360 - 180;
    drag.angle = angle;
    const steps = Math.round(drag.remainder / degrees);
    if (steps) {
      draggedSincePress = true;
      drag.remainder -= steps * degrees;
      shiftTime(steps * unit);
    }
  });
  hand.addEventListener('lostpointercapture', event => {
    if (drag?.id === event.pointerId) drag = undefined;
  });
}

function drawQuizClock() {
  drawClock(current);
  const minute = current % 60;
  clock.setAttribute('aria-label', t('clock', Math.floor(current / 60) || 12, minute / 5 || 12));
}

let language = 'zh';
function t(key, ...values) {
  return translations[language][key].replace(/\{(\d+)\}/g, (_, index) => values[index]);
}
function applyLanguage() {
  document.documentElement.lang = language === 'zh' ? 'zh-CN' : language;
  document.title = t('title');
  document.querySelector('meta[name="description"]').content = t('description');
  for (const [selector, key] of Object.entries(staticLabels)) {
    document.querySelector(selector).textContent = t(key);
  }
  document.querySelector('.modes').setAttribute('aria-label', t('modes'));
  score.textContent = t('score', stars);
  updateProgress();
  feedback.textContent = '';
  hourHand.setAttribute('aria-label', t('hour'));
  minuteHand.setAttribute('aria-label', t('minute'));
  showReadingAnswer(!readingAnswer.hidden);
  if (exploring) clock.setAttribute('aria-label', t('adjustable'));
  else drawQuizClock();
}

  language = languagePicker.value;
